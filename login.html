<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduChess</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: rgb(247, 249, 247);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .check-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(45deg, rgba(22, 140, 60, 0.03) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(22, 140, 60, 0.03) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(22, 140, 60, 0.03) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(22, 140, 60, 0.03) 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(22, 140, 60, 0.12);
            width: 90%;
            max-width: 420px;
            border: 1px solid rgba(22, 140, 60, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-family: 'PT Serif', serif;
            color: rgb(15, 100, 42);
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        .logo p {
            font-family: 'Courier New', Courier, monospace;
            color: rgb(22, 140, 60);
            font-size: 0.9rem;
        }

        .toggle-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: rgb(238, 245, 240);
            padding: 0.3rem;
            border-radius: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: 'Franklin Gothic Medium', Arial, sans-serif;
            font-size: 0.95rem;
            color: rgb(22, 140, 60);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: rgb(22, 140, 60);
            color: white;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.3rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgb(15, 100, 42);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid rgba(22, 140, 60, 0.2);
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            background: rgb(247, 249, 247);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgb(22, 140, 60);
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            background: rgb(22, 140, 60);
            color: white;
            font-family: 'Franklin Gothic Medium', Arial, sans-serif;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: rgb(15, 100, 42);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 140, 60, 0.3);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            color: rgb(185, 28, 28);
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: none;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }

            .logo h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="check-bg"></div>
    
    <div class="container">
        <div class="logo">
            <h1>EDUCHESS</h1>
            <p>Professional Chess Coaching</p>
        </div>

        <div class="toggle-container">
            <button class="toggle-btn active" id="loginToggle">Login</button>
            <button class="toggle-btn" id="signupToggle">Sign Up</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <!-- Login Form -->
        <div class="form-section active" id="loginForm">
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>

        <!-- Signup Form -->
        <div class="form-section" id="signupForm">
            <form id="signupFormElement">
                <div class="form-group">
                    <label for="signupUsername">Username</label>
                    <input type="text" id="signupUsername" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" required autocomplete="new-password">
                </div>
                <button type="submit" class="submit-btn">Sign Up</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

        // ── Firebase (shared "demo" project — same DB that stores demo requests) ──
        const demoConfig = {
            apiKey: "AIzaSyAyU-6KTAVNhgJrjMMPq8nRdGWVZaZCPB4",
            authDomain: "chess-demo-ed80b.firebaseapp.com",
            databaseURL: "https://chess-demo-ed80b-default-rtdb.firebaseio.com",
            projectId: "chess-demo-ed80b",
            storageBucket: "chess-demo-ed80b.firebasestorage.app",
            messagingSenderId: "967444408413",
            appId: "1:967444408413:web:1fc30027f2db82fb4245b4"
        };
        const app = initializeApp(demoConfig);
        const db = getDatabase(app);

        const SESSION_DURATION = 7 * 24 * 60 * 60 * 1000; // 7 days in milliseconds

        // Firebase keys can't contain . # $ [ ] / — encode usernames into a safe,
        // case-insensitive key so one person = one account globally.
        function userKey(username) {
            return encodeURIComponent(username.trim().toLowerCase()).replace(/\./g, '%2E');
        }

        async function getUser(username) {
            const snap = await get(ref(db, `users/${userKey(username)}`));
            return snap.exists() ? snap.val() : null;
        }

        async function saveUser(username, password) {
            await set(ref(db, `users/${userKey(username)}`), {
                username: username,
                password: password,
                createdAt: new Date().toISOString()
            });
        }

        function setLoggedInUser(username) {
            const sessionData = {
                username: username,
                expiry: Date.now() + SESSION_DURATION
            };
            localStorage.setItem('loggedInUser', JSON.stringify(sessionData));
        }

        function getLoggedInUser() {
            const sessionData = localStorage.getItem('loggedInUser');
            if (!sessionData) return null;

            const { username, expiry } = JSON.parse(sessionData);

            // Check if session has expired
            if (Date.now() > expiry) {
                localStorage.removeItem('loggedInUser');
                return null;
            }

            return username;
        }

        // Check if user is already logged in
        if (getLoggedInUser()) {
            window.location.href = 'index.html';
        }

        // Toggle between login and signup
        const loginToggle = document.getElementById('loginToggle');
        const signupToggle = document.getElementById('signupToggle');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const errorMessage = document.getElementById('errorMessage');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }

        loginToggle.addEventListener('click', () => {
            loginToggle.classList.add('active');
            signupToggle.classList.remove('active');
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
            errorMessage.classList.remove('show');
        });

        signupToggle.addEventListener('click', () => {
            signupToggle.classList.add('active');
            loginToggle.classList.remove('active');
            signupForm.classList.add('active');
            loginForm.classList.remove('active');
            errorMessage.classList.remove('show');
        });

        // Handle login
        document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            const btn = e.target.querySelector('.submit-btn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Logging in…';

            try {
                const user = await getUser(username);

                if (!user) {
                    showError('Username not found. Please sign up first.');
                    return;
                }

                if (user.password !== password) {
                    showError('Incorrect password');
                    return;
                }

                // Login successful — store the canonical username from the account
                setLoggedInUser(user.username);
                window.location.href = 'index.html';
            } catch (err) {
                console.error('Login failed:', err);
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });

        // Handle signup
        document.getElementById('signupFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('signupUsername').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            if (!username || !password || !confirmPassword) {
                showError('Please fill in all fields');
                return;
            }

            if (password.length < 4) {
                showError('Password must be at least 4 characters');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            const btn = e.target.querySelector('.submit-btn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Creating…';

            try {
                // Global uniqueness check — same username can't register twice (any browser)
                const existing = await getUser(username);
                if (existing) {
                    showError('Username already exists');
                    return;
                }

                // Signup successful
                await saveUser(username, password);
                setLoggedInUser(username);
                window.location.href = 'index.html';
            } catch (err) {
                console.error('Signup failed:', err);
                showError('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
