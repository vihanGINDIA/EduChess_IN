<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Classes - EduChess</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: rgb(247, 249, 247);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .check-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(45deg, rgba(22,140,60,0.03) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(22,140,60,0.03) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(22,140,60,0.03) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(22,140,60,0.03) 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
            pointer-events: none; z-index: 0;
        }

        /* Progress bar */
        #steps {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 5px;
            display: flex; z-index: 1000;
            background: rgba(22,140,60,0.1);
        }
        #steps div { flex: 1; background: rgba(22,140,60,0.2); transition: background 0.4s ease; }
        #steps div.active { background: rgb(22,140,60); }

        /* Back button */
        #back {
            position: fixed; top: 18px; left: 18px;
            width: 42px; height: 42px; border-radius: 50%;
            background: white; border: 2px solid rgb(22,140,60);
            color: rgb(22,140,60); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 999; transition: all 0.25s ease;
            box-shadow: 0 2px 10px rgba(22,140,60,0.15);
        }
        #back:hover { background: rgb(22,140,60); color: white; transform: scale(1.08); }

        /* Step containers */
        .step {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1;
            animation: fadeUp 0.35s ease forwards;
        }
        .step.active { display: flex; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Step 1 */
        #one { padding-top: 10px; }
        #Form {
            width: 90vw; height: 82vh; max-width: 700px;
            border: none; border-radius: 14px;
            box-shadow: 0 6px 28px rgba(22,140,60,0.14);
            background: white; display: block;
        }

        /* Form status badge */
        #formStatus {
            display: flex; align-items: center; gap: 0.5rem;
            margin-top: 0.75rem; padding: 0.55rem 1rem;
            border-radius: 20px;
            font-family: 'Courier New', Courier, monospace; font-size: 0.82rem;
            background: white; border: 1.5px solid rgba(22,140,60,0.2);
            color: rgb(100,110,100); transition: all 0.4s ease;
            box-shadow: 0 2px 8px rgba(22,140,60,0.08);
        }
        #formStatus.done { border-color: rgb(22,140,60); color: rgb(15,100,42); background: rgb(236,252,243); }
        #formStatus .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgb(180,185,180); flex-shrink: 0; transition: background 0.4s ease;
        }
        #formStatus.done .dot { background: rgb(22,140,60); box-shadow: 0 0 0 3px rgba(22,140,60,0.2); }

        /* Step 2 */
        #two { padding: 2rem 1.5rem; gap: 0; overflow-y: auto; padding-bottom: 90px; }

        .picker-section { width: 100%; max-width: 820px; margin-bottom: 2rem; }
        .picker-section h2 {
            font-family: 'PT Serif', serif; font-size: 1.6rem;
            color: rgb(15,100,42); margin-bottom: 1rem; padding-left: 4px;
        }
        .picker-section .hint {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem; color: rgb(120,130,120);
            margin-bottom: 0.75rem; padding-left: 4px;
        }

        #Day, #Time { display: flex; gap: 0.75rem; flex-wrap: wrap; }

        .Days, .Time {
            padding: 0.75rem 1.4rem;
            border: 2px solid rgba(22,140,60,0.3);
            background: white; border-radius: 8px; cursor: pointer;
            font-family: 'Franklin Gothic Medium', Arial, sans-serif;
            font-size: 0.92rem; color: rgb(22,140,60);
            transition: all 0.22s ease; min-width: 95px; text-align: center;
            box-shadow: 0 1px 4px rgba(22,140,60,0.06);
        }
        .Days:hover:not(.maxed), .Time:hover:not(.booked):not(.grey) {
            background: rgb(220,248,232); border-color: rgb(22,140,60);
            transform: translateY(-1px); box-shadow: 0 3px 10px rgba(22,140,60,0.15);
        }
        .Days.selected, .Time.selected {
            background: rgb(22,140,60); color: white; border-color: rgb(22,140,60);
            box-shadow: 0 4px 14px rgba(22,140,60,0.3);
        }
        /* Day maxed-out (3 already picked, this one not selected) */
        .Days.maxed {
            opacity: 0.45; cursor: not-allowed; pointer-events: none;
        }

        .Time.booked {
            opacity: 0.4; cursor: not-allowed; text-decoration: line-through;
            pointer-events: none; background: rgb(245,245,245);
            border-color: rgb(200,200,200); color: rgb(130,130,130);
        }
        .Time.booked::after { content: ' ✗'; font-size: 0.75rem; }

        .Time.grey {
            background: rgb(235,237,235); color: rgb(160,160,160);
            border-color: rgb(215,215,215); pointer-events: none; cursor: not-allowed;
        }

        /* Selected-days counter */
        #dayCounter {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem; color: rgb(22,140,60);
            margin-top: 0.6rem; padding-left: 4px;
            min-height: 1.2em;
        }

        /* Floating buttons */
        #nextParent, #submitParent {
            position: fixed; bottom: 28px; right: 28px;
            z-index: 999; display: none;
        }
        #nextParent.visible, #submitParent.visible { display: block; }

        #next, #submitBtn {
            padding: 0.9rem 2.5rem;
            background: rgb(22,140,60); color: white;
            border: none; border-radius: 8px;
            font-family: 'Franklin Gothic Medium', Arial, sans-serif;
            font-size: 1rem; letter-spacing: 0.04em; cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(22,140,60,0.3);
        }
        #next:hover, #submitBtn:hover:not(.disabled) {
            background: rgb(15,100,42); transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(22,140,60,0.35);
        }
        #next.disabled, #submitBtn.disabled {
            background: rgb(180,185,180); cursor: not-allowed;
            pointer-events: none; box-shadow: none;
        }

        /* Step 3 */
        #three { text-align: center; padding: 2rem; }
        .confirm-icon {
            width: 96px; height: 96px; border-radius: 50%;
            background: rgb(22,140,60);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.8rem;
            animation: pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
            box-shadow: 0 8px 24px rgba(22,140,60,0.35);
        }
        @keyframes pop {
            0%   { transform: scale(0); opacity: 0; }
            60%  { transform: scale(1.12); }
            100% { transform: scale(1); opacity: 1; }
        }
        .confirm-icon::after { content: '✓'; font-size: 2.8rem; color: white; font-weight: bold; }

        #three h1 {
            font-family: 'PT Serif', serif; font-size: 2.4rem;
            color: rgb(15,100,42); margin-bottom: 0.6rem;
        }
        #three > p {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem; color: rgb(100,110,100); margin-bottom: 2rem;
        }
        .detail-box {
            background: white; padding: 1.8rem 2.2rem; border-radius: 14px;
            max-width: 460px; margin: 0 auto;
            box-shadow: 0 4px 20px rgba(22,140,60,0.13);
            border: 1px solid rgba(22,140,60,0.18); text-align: left;
        }
        .detail-box h3 {
            font-family: 'PT Serif', serif; color: rgb(15,100,42);
            font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(22,140,60,0.15);
        }
        .detail-row {
            display: flex; align-items: flex-start; gap: 0.6rem;
            padding: 0.5rem 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem; color: rgb(40,40,40);
        }
        .detail-row span.label { color: rgb(22,140,60); font-weight: bold; min-width: 60px; }

        /* Toast */
        #toast {
            position: fixed; bottom: 90px; right: 28px;
            background: rgb(185,28,28); color: white;
            padding: 0.8rem 1.2rem; border-radius: 8px;
            font-size: 0.88rem; font-family: 'Courier New', Courier, monospace;
            z-index: 1100; opacity: 0; transform: translateY(10px);
            transition: all 0.3s ease; max-width: 260px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15); pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            #Form { width: 95vw; height: 78vh; }
            .Days, .Time { min-width: 78px; padding: 0.6rem 0.9rem; font-size: 0.82rem; }
            #next, #submitBtn { padding: 0.8rem 2rem; font-size: 0.92rem; }
            #three h1 { font-size: 1.9rem; }
        }
        @media (max-width: 480px) {
            .picker-section h2 { font-size: 1.3rem; }
            #nextParent, #submitParent { right: 16px; bottom: 18px; }
        }
    </style>
</head>
<body>
    <div class="check-bg"></div>

    <div id="steps"><div class="active"></div><div></div></div>
    <button id="back">←</button>

    <!-- Step 1: Google Form -->
    <div class="step active" id="one">
        <iframe id="Form" src="https://forms.gle/pGf51FGyXCvHWXnf7"></iframe>
        <div id="formStatus">
            <span class="dot"></span>
            <span id="formStatusText">Fill and submit the form above to continue</span>
        </div>
    </div>

    <!-- Step 2: Day + Time -->
    <div class="step" id="two">
        <div class="picker-section">
            <h2>Select 3 Days</h2>
            <p class="hint">Pick exactly 3 days for your weekly classes</p>
            <div id="Day">
                <button class="Days" data-day="0">Monday</button>
                <button class="Days" data-day="1">Tuesday</button>
                <button class="Days" data-day="2">Wednesday</button>
                <button class="Days" data-day="3">Thursday</button>
                <button class="Days" data-day="4">Friday</button>
                <button class="Days" data-day="5">Saturday</button>
                <button class="Days" data-day="6">Sunday</button>
            </div>
            <div id="dayCounter">0 / 3 days selected</div>
        </div>

        <div class="picker-section">
            <h2>Select 1 Time Slot</h2>
            <p class="hint">Select a day first — booked slots will be shown</p>
            <div id="Time">
                <button class="Time grey" data-time="0">4–5 PM</button>
                <button class="Time grey" data-time="1">5–6 PM</button>
                <button class="Time grey" data-time="2">6–7 PM</button>
                <button class="Time grey" data-time="3">7–8 PM</button>
                <button class="Time grey" data-time="4">8–9 PM</button>
                <button class="Time grey" data-time="5">9–10 PM</button>
            </div>
        </div>
    </div>

    <!-- Step 3: Confirmation -->
    <div class="step" id="three">
        <div class="confirm-icon"></div>
        <h1>Classes Booked!</h1>
        <p>Your weekly classes have been confirmed.</p>
        <div class="detail-box">
            <h3>📋 Booking Details</h3>
            <div class="detail-row">
                <span class="label">Days:</span>
                <span id="confirm-days"></span>
            </div>
            <div class="detail-row">
                <span class="label">Time:</span>
                <span id="confirm-time"></span>
            </div>
            <div class="detail-row">
                <span class="label">User:</span>
                <span id="confirm-user"></span>
            </div>
        </div>
    </div>

    <!-- Floating buttons -->
    <div id="nextParent" class="visible">
        <button id="next" class="disabled">NEXT →</button>
    </div>
    <div id="submitParent">
        <button id="submitBtn" class="disabled">SUBMIT</button>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getDatabase, ref, set, push, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

        // ── Firebase: booking DB (regular classes) ──
        const bookingConfig = {
            apiKey: "AIzaSyCYxf8GHpL3uIn_qoCwTnDCjwP4zrAwH8I",
            authDomain: "chess-cf01f.firebaseapp.com",
            databaseURL: "https://chess-cf01f-default-rtdb.firebaseio.com",
            projectId: "chess-cf01f",
            storageBucket: "chess-cf01f.firebasestorage.app",
            messagingSenderId: "995150306218",
            appId: "1:995150306218:web:65b9d26ca05c478e73a9d3"
        };

        // ── Firebase: demo DB (to block demo-booked slots here too) ──
        const demoConfig = {
            apiKey: "AIzaSyAyU-6KTAVNhgJrjMMPq8nRdGWVZaZCPB4",
            authDomain: "chess-demo-ed80b.firebaseapp.com",
            databaseURL: "https://chess-demo-ed80b-default-rtdb.firebaseio.com",
            projectId: "chess-demo-ed80b",
            storageBucket: "chess-demo-ed80b.firebasestorage.app",
            messagingSenderId: "967444408413",
            appId: "1:967444408413:web:1fc30027f2db82fb4245b4"
        };

        const bookingApp = initializeApp(bookingConfig);
        const db         = getDatabase(bookingApp);

        const demoApp = initializeApp(demoConfig, 'demoApp');
        const demoDb  = getDatabase(demoApp);

        // ── Auth check ──
        function getLoggedInUser() {
            try {
                const s = localStorage.getItem('loggedInUser');
                if (!s) return null;
                const { username, expiry } = JSON.parse(s);
                if (Date.now() > expiry) { localStorage.removeItem('loggedInUser'); return null; }
                return username;
            } catch { return null; }
        }

        const currentUser = getLoggedInUser();
        if (!currentUser) window.location.href = 'login.html';

        // ── State ──
        let currentStep  = 1;
        const selectedDays = new Set();
        let selectedTime = null;

        // Booked slots from both DBs
        const classBookedSlots = {};  // regular classes DB
        const demoBookedSlots  = {};  // demo DB — blocks here too

        const dayNames  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        const timeSlots = ['4–5 PM','5–6 PM','6–7 PM','7–8 PM','8–9 PM','9–10 PM'];

        // 6–7 PM (idx 2) and 7–8 PM (idx 3) hardcoded-blocked Mon–Fri
        const HARDCODED = { 2: [0,1,2,3,4], 3: [0,1,2,3,4] };

        // ── DOM refs ──
        const stepOne      = document.getElementById('one');
        const stepTwo      = document.getElementById('two');
        const stepThree    = document.getElementById('three');
        const backBtn      = document.getElementById('back');
        const nextBtn      = document.getElementById('next');
        const nextParent   = document.getElementById('nextParent');
        const submitBtn    = document.getElementById('submitBtn');
        const submitParent = document.getElementById('submitParent');
        const progressSegs = document.querySelectorAll('#steps div');
        const toast        = document.getElementById('toast');
        const dayCounter   = document.getElementById('dayCounter');

        // ── Toast ──
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 3200);
        }

        // ── Load booked slots from BOTH databases ──
        async function loadBookedSlots() {
            try {
                const [classSnap, demoSnap] = await Promise.all([
                    get(ref(db,     'bookedSlots')),
                    get(ref(demoDb, 'bookedSlots'))
                ]);
                if (classSnap.exists()) Object.assign(classBookedSlots, classSnap.val());
                if (demoSnap.exists())  Object.assign(demoBookedSlots,  demoSnap.val());
            } catch (err) {
                console.error('Failed to load booked slots:', err);
            }
        }

        // ── Check if a time slot is blocked for ANY of the selected days ──
        // A slot is blocked if it's hardcoded, booked as a regular class,
        // OR booked as a demo on that same day
        function isTimeBlockedForAnyDay(timeIdx) {
            for (const dayIdx of selectedDays) {
                if (HARDCODED[timeIdx]?.includes(dayIdx))       return true;
                if (classBookedSlots[dayIdx]?.[timeIdx])        return true;
                if (demoBookedSlots[dayIdx]?.[timeIdx])         return true;  // ← demo cross-block
            }
            return false;
        }

        // ── Refresh time buttons ──
        function updateTimeButtons() {
            document.querySelectorAll('.Time').forEach((btn, idx) => {
                btn.classList.remove('grey', 'booked', 'selected');

                if (selectedDays.size === 0) {
                    btn.classList.add('grey');
                } else if (isTimeBlockedForAnyDay(idx)) {
                    btn.classList.add('booked');
                    if (selectedTime === idx) selectedTime = null;
                }
            });

            // Re-highlight selected time if still valid
            if (selectedTime !== null) {
                const btn = document.querySelector(`.Time[data-time="${selectedTime}"]`);
                if (btn && !btn.classList.contains('booked')) {
                    btn.classList.add('selected');
                } else {
                    selectedTime = null;
                }
            }
        }

        // ── Grey-out unselected days once 3 are chosen ──
        function updateDayButtons() {
            document.querySelectorAll('.Days').forEach(btn => {
                const dayIdx = parseInt(btn.dataset.day);
                if (selectedDays.size >= 3 && !selectedDays.has(dayIdx)) {
                    btn.classList.add('maxed');
                } else {
                    btn.classList.remove('maxed');
                }
            });
            dayCounter.textContent = `${selectedDays.size} / 3 days selected`;
        }

        // ── Submit button state ──
        function updateSubmitBtn() {
            if (selectedDays.size === 3 && selectedTime !== null) {
                submitBtn.classList.remove('disabled');
            } else {
                submitBtn.classList.add('disabled');
            }
        }

        // ── Navigate to a step ──
        function goToStep(n) {
            [stepOne, stepTwo, stepThree].forEach((el, i) => el.classList.toggle('active', i+1 === n));
            currentStep = n;
            progressSegs.forEach((seg, i) => seg.classList.toggle('active', i < n));
            backBtn.style.display = n === 3 ? 'none' : 'flex';
            nextParent.classList.toggle('visible', n === 1);
            submitParent.classList.toggle('visible', n === 2);
            document.getElementById('steps').style.display = n === 3 ? 'none' : 'flex';
        }

        // ── Google Form submission detection (2nd iframe load = submitted) ──
        const iframe         = document.getElementById('Form');
        const formStatus     = document.getElementById('formStatus');
        const formStatusText = document.getElementById('formStatusText');
        let iframeLoadCount  = 0;
        let formSubmitted    = false;

        iframe.addEventListener('load', () => {
            iframeLoadCount++;
            if (iframeLoadCount >= 2 && !formSubmitted) {
                formSubmitted = true;
                nextBtn.classList.remove('disabled');
                formStatus.classList.add('done');
                formStatusText.textContent = 'Form submitted! Click NEXT to choose your slots.';
            }
        });

        // ── NEXT (step 1 → 2) ──
        nextBtn.addEventListener('click', async () => {
            if (nextBtn.classList.contains('disabled')) return;
            nextBtn.textContent = 'Loading…';
            nextBtn.style.pointerEvents = 'none';
            await loadBookedSlots();
            nextBtn.textContent = 'NEXT →';
            nextBtn.style.pointerEvents = '';
            goToStep(2);
            updateTimeButtons();
        });

        // ── BACK ──
        backBtn.addEventListener('click', () => {
            if (currentStep === 2) {
                selectedDays.clear();
                selectedTime = null;
                document.querySelectorAll('.Days').forEach(b => b.classList.remove('selected','maxed'));
                updateDayButtons();
                updateTimeButtons();
                updateSubmitBtn();
                goToStep(1);
            } else if (currentStep === 1) {
                window.location.href = 'index.html';
            }
        });

        // ── Day selection (up to 3) ──
        document.querySelectorAll('.Days').forEach(btn => {
            btn.addEventListener('click', () => {
                const dayIdx = parseInt(btn.dataset.day);

                if (selectedDays.has(dayIdx)) {
                    selectedDays.delete(dayIdx);
                    btn.classList.remove('selected');
                } else if (selectedDays.size < 3) {
                    selectedDays.add(dayIdx);
                    btn.classList.add('selected');
                }

                updateDayButtons();
                updateTimeButtons();
                updateSubmitBtn();
            });
        });

        // ── Time selection ──
        document.querySelectorAll('.Time').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('booked') || btn.classList.contains('grey')) return;
                const timeIdx = parseInt(btn.dataset.time);
                document.querySelectorAll('.Time').forEach(b => b.classList.remove('selected'));
                if (selectedTime === timeIdx) {
                    selectedTime = null;
                } else {
                    selectedTime = timeIdx;
                    btn.classList.add('selected');
                }
                updateSubmitBtn();
            });
        });

        // ── SUBMIT ──
        submitBtn.addEventListener('click', async () => {
            if (selectedDays.size !== 3 || selectedTime === null) return;

            submitBtn.textContent = 'Saving…';
            submitBtn.classList.add('disabled');

            try {
                const daysArray = Array.from(selectedDays);

                // Write request record
                const requestRef = push(ref(db, 'requests'));
                await set(requestRef, {
                    username:   currentUser,
                    days:       daysArray.map(i => dayNames[i]),
                    dayIndices: daysArray,
                    time:       timeSlots[selectedTime],
                    timeIndex:  selectedTime,
                    status:     'pending',
                    createdAt:  new Date().toISOString()
                });

                // Mark slots as booked in the regular classes DB
                for (const dayIdx of daysArray) {
                    await set(ref(db, `bookedSlots/${dayIdx}/${selectedTime}`), true);
                }

                // Populate confirmation
                document.getElementById('confirm-days').textContent =
                    daysArray.map(i => dayNames[i]).join(', ');
                document.getElementById('confirm-time').textContent = timeSlots[selectedTime];
                document.getElementById('confirm-user').textContent = currentUser;

                goToStep(3);

            } catch (err) {
                console.error('Booking error:', err);
                submitBtn.textContent = 'Error – Retry';
                submitBtn.classList.remove('disabled');
                showToast('Something went wrong. Please try again.');
            }
        });

        // Init
        goToStep(1);
    </script>
</body>
</html>
